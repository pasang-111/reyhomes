Here's what's wrong with the live deploy and how to fix it.

Diagnosis
Check	Result
Frontend UI	Loads
Backend API	Up — /api/designs/ returns 200 with empty results: []
Home Designs page	Shows “Something went wrong (500)” and 0 residences
CORS	Broken — no Access-Control-Allow-Origin for your Vercel origin
Database	Empty — no designs/packages seeded
Root causes:

Render env still has placeholders
CORS_ALLOWED_ORIGINS=https://your-frontend.vercel.app
instead of https://reyhomes-yc57.vercel.app
Vercel likely missing / wrong NEXT_PUBLIC_API_URL
Without https://reyhomes-backend.onrender.com, SSR falls back to http://127.0.0.1:8000 → list pages error / empty.
No content in Postgres until you create it in Django admin.
Fix (you must do this in the dashboards)
1. Render → reyhomes-backend → Environment
Set:

Key	Value
ALLOWED_HOSTS	reyhomes-backend.onrender.com
CORS_ALLOWED_ORIGINS	https://reyhomes-yc57.vercel.app
CSRF_TRUSTED_ORIGINS	https://reyhomes-backend.onrender.com,https://reyhomes-yc57.vercel.app
Save → Manual Deploy (restart required).

Verify CORS:

curl -s -D - -o /dev/null \
  -H "Origin: https://reyhomes-yc57.vercel.app" \
  https://reyhomes-backend.onrender.com/api/designs/ | grep -i access-control
You want:

access-control-allow-origin: https://reyhomes-yc57.vercel.app

2. Vercel → Project → Environment Variables
Key	Value
NEXT_PUBLIC_API_URL	https://reyhomes-backend.onrender.com
Apply to Production (and Preview). Redeploy the frontend — NEXT_PUBLIC_* is baked in at build time.

3. Seed data
Open https://reyhomes-backend.onrender.com/admin/
Log in with the superuser from Render (DJANGO_SUPERUSER_USERNAME / PASSWORD).
Create at least one Home design with published checked.
Refresh https://reyhomes-yc57.vercel.app/home-designs
4. (Recommended) Media
Free Render wipes local media on every deploy. Configure R2 / S3 / Cloudinary as in DEPLOY.md (USE_S3 or USE_CLOUDINARY).

